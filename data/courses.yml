- name: Value-Based Marketing
  description: "Students master cutting-edge marketing strategies by analyzing real-world cases, developing data-driven insights, and designing customer-centric campaigns. They leave prepared to drive growth, build powerful brands, and lead innovation in dynamic global markets."
  objective: "Understand and apply value-driven marketing strategies."

- name: Data and Digital Literacy
  description: "Students develop hands-on expertise with R by analyzing real consumer data, extracting actionable insights, and applying advanced methods like conjoint analysis. They finish by delivering an independent marketing project."
  objective: "Develop skills in data-driven marketing analysis using R."

- name: Agile and Sustainable Marketing Strategies
  description: "Students explore ethical marketing, sustainability, and stakeholder engagement, gaining the tools to lead with integrity in a connected world. They learn to manage responsible communication and promote digital well-being."
  objective: "Master agility, sustainability, and ethics in marketing."

- name: Internet of Things (IoT) in Marketing
  description: "Students investigate how IoT devices, X-realities, and mobile apps transform consumer behavior and market intelligence. Through hands-on workshops, they design personalized consumer experiences integrating innovation with social responsibility."
  objective: "Learn to leverage IoT, X-realities, and mobile apps in marketing."

- name: Content Creation and Management
  description: "Students gain practical skills using Google Forms and RStudio to design surveys, analyze data, and create visually compelling dashboards. They acquire hands-on experience in content management and data visualization."
  objective: "Develop skills in creating engaging digital content and visualizations."

- name: Experiential Marketing
  description: "Students learn to design experiential marketing campaigns that blend physical and digital touchpoints. They apply technologies like Big Data, AI, and X-realities to create engaging, interactive brand experiences."
  objective: "Learn to create interactive, hybrid brand experiences."

- name: Reputation and Media Management
  description: "Students develop the skills to manage public image, communication channels, and stakeholder relationships. They engage with public relations, guerrilla marketing, and crisis communication to protect brand reputation."
  objective: "Master techniques for managing brand reputation."

- name: Data Analysis and AI
  description: "Students acquire skills to analyze data and leverage digital tools, including gamified applications and AR technologies, to extract actionable consumer insights and inform strategic marketing decisions."
  objective: "Apply AI tools and digital media analysis in marketing."

- name: Academic Research Design and Consulting Practice
  description: "Students learn research design, data collection methods, and consulting practices through hands-on projects. They tackle real-world consulting scenarios, culminating in a research or consulting proposal."
  objective: "Develop skills in research design and consulting."

- name: Special Topics
  description: "Students engage with contemporary trends in experiential digital marketing, analyzing the latest research and industry practices. They develop critical skills to evaluate the impact of marketing strategies on societal outcomes."
  objective: "Explore trends and issues in experiential digital marketing."
